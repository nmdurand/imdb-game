services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: imdbgame
      POSTGRES_PASSWORD: imdbgame
      POSTGRES_DB: imdbgame
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imdbgame -d imdbgame"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
